<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ Cá Rô - Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cờ Cá Rô</h1>
        <div class="game-info">
            <p id="status">Lượt của: <span id="current-player">X</span></p>
            <p id="score">
                <span>X: <span id="score-x">0</span></span>
                <span>O: <span id="score-o">0</span></span>
                <span>Hòa: <span id="score-draw">0</span></span>
            </p>
        </div>
        <div class="game-board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <div class="controls">
            <button id="reset-btn">Chơi lại</button>
            <button id="clear-score-btn">Xóa điểm</button>
        </div>
        <div class="winner-message" id="winner-message">
            <div class="winner-content">
                <p id="winner-text"></p>
                <button id="new-game-btn">Ván mới</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
