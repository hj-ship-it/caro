<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ Cá Rô 100x100</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cờ Cá Rô</h1>
        <div class="game-info">
            <p id="status">Lượt của: <span id="current-player">X</span></p>
            <p id="score">
                <span>X: <span id="score-x">0</span></span>
                <span>O: <span id="score-o">0</span></span>
                <span>Hòa: <span id="score-draw">0</span></span>
            </p>
            <p class="info-text">5 ô liên tiếp để thắng | Kéo để di chuyển | Pinch/Zoom để phóng to</p>
        </div>

        <div class="zoom-controls">
            <button id="zoom-in-btn">+</button>
            <button id="zoom-out-btn">-</button>
            <button id="center-btn">↺</button>
            <span id="zoom-level">100%</span>
        </div>

        <div class="board-container" id="board-container">
            <div class="game-board" id="board"></div>
        </div>

        <div class="controls">
            <button id="reset-btn">Chơi lại</button>
            <button id="clear-score-btn">Xóa điểm</button>
        </div>
        <div class="winner-message" id="winner-message">
            <div class="winner-content">
                <p id="winner-text"></p>
                <button id="new-game-btn">Ván mới</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
